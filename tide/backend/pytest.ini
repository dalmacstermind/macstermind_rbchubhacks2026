[pytest]
# Lets `pytest` (not only `python -m pytest`) import tide_api and tide from this folder.
pythonpath = .
testpaths = tests
# Real-model tests load ~2 GB of weights from backend/models; run them with `pytest -m models`.
markers =
    models: needs the real model files in backend/models (slow; run with -m models)
addopts = -m "not models"
