# Builds the Windows installer. Build the back end first (see ../README.md), then: npm run dist:win
appId: org.tide.app
productName: TIDE
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  # The packaged FastAPI back end (made by PyInstaller in ../backend/dist/tide-api)
  - from: ../backend/dist/tide-api
    to: backend
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: TIDE
  artifactName: TIDE-Setup-${version}.exe
publish: null
