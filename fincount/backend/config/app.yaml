# TIDE app settings (not protocol rules; those are in protocol.yaml).

frames:
  # Seeking in long camera videos can land a few frames off. We seek this many seconds before the
  # start of each range, then read frames in order and use the decoder's timestamps.
  seek_preroll_s: 1.0

clips:
  # Bundled FFmpeg binary, relative to this config folder (or an absolute path).
  # null = no FFmpeg: clips are written with OpenCV instead (they may not play in the app).
  ffmpeg_path: null
  # libx264 makes clips that play in the app's video player (H.264). Needs a GPL FFmpeg build;
  # see docs/LICENCES.md.
  ffmpeg_codec: libx264
  # Codec for the OpenCV fallback. mp4v always works but Chromium can't play it.
  opencv_fourcc: mp4v

# ── Vision pipeline (aquavision/detect.py, species.py, track.py, clarity.py) ──
# Read by load_vision_config(). Thresholds are uncalibrated starting points: tune them on a
# held-out video (CLAUDE.md, Data and evaluation rules) and change them here, never in code.

models:
  # Local model folder, relative to this config folder (or absolute). Nothing is downloaded at
  # runtime: developers fetch weights once with `python -m aquavision.fetch_models`.
  dir: ../models

detect:
  # Interim detector until a fine-tuned YOLOX exists: Community Fish Detector (RF-DETR, 1 class
  # "fish"). See docs/LICENCES.md for its licence status.
  checkpoint: cfd/cfd-rf-detr-medium-1024-2026.03.24.cp-011.20260706-release.pth
  conf_threshold: 0.2       # the API returns every box at or above this (API.md, "Who decides what")
  nms_iou: 0.5              # merging boxes from the original and the cleared-up picture
  min_box_px: 6             # boxes narrower or shorter than this many pixels are dropped
  # Pictures per second read from each subsample point's ±context_s range (protocol.yaml). The
  # point's own moment is always included. More = better tracking, slower processing.
  context_fps: 5

species:
  model_dir: bioclip-2      # BioCLIP 2 snapshot (open_clip format) inside models.dir
  match_threshold: 0.70     # cosine similarity needed to suggest a species (uncalibrated)
  margin: 0.03              # best species must beat the next one by this much
  novelty_threshold: 0.45   # below this, the fish is a "Potential Novel Sighting" for expert review
  top_k: 3                  # suggestions shown to staff
  crop_padding: 0.12        # extra space around each box when cutting the crop
  min_crop_px: 24           # crops smaller than this are too small to identify

track:
  enabled: true             # ByteTrack across the sampled pictures of each video
  lost_buffer_s: 2.0        # keep a lost fish's track this long
  match_iou: 0.2            # box overlap needed to continue a track
  activation_threshold: 0.35  # a box must be at least this sure to start a new track

clarity:
  # Clarity index (0–100) = weighted mean of these image measures, each scaled to 0–1.
  # It is an image-based estimate, not turbidity (CLAUDE.md, Clarity index).
  weights:
    contrast: 0.25
    sharpness: 0.25
    haze: 0.20
    colour: 0.15
    particles: 0.15
  # Suggested visibility category from the clarity index: one boundary between each pair of
  # protocol.yaml visibility.categories (3 boundaries for 4 categories). UNCALIBRATED: set them
  # from frames where staff recorded a category. Staff confirm the category; only that is exported.
  category_thresholds: [30, 50, 70]
  review_threshold: 25      # below this, the point needs review and gets a "low visibility" note

label:
  match_iou: 0.5            # a drawn box overlapping an existing fish this much relabels it (no double count)
